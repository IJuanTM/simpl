services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        PHP_VERSION: ${PHP_VERSION:-8.5}
    # Rerun (idempotent) at container start: app-key.php because the bind mount below hides the key already generated at build time behind the host's own unkeyed src/.env; the cert copy because a real cert dropped into docker/certs/ after the image was built still needs to land where Apache actually looks.
    command: sh -c "if [ -f docker/certs/simpl.crt ] && [ -f docker/certs/simpl.key ]; then cp docker/certs/simpl.crt /etc/apache2/ssl/simpl.crt && cp docker/certs/simpl.key /etc/apache2/ssl/simpl.key; fi && php src/app/Scripts/app-key.php && apache2-foreground"
    ports:
      - "${APP_PORT:-80}:80"
      - "${APP_SSL_PORT:-443}:443"
    environment:
      DEV: ${DEV:-true}
      # @addon-placeholder:environment
    volumes:
      - .:/var/www/html
      - simpl_vendor:/var/www/html/src/vendor
    networks:
      - simpl
    restart: unless-stopped
    # @addon-placeholder:depends_on
  # @addon-placeholder:services

volumes:
  simpl_vendor:
  # @addon-placeholder:volumes

networks:
  simpl:
    driver: bridge
