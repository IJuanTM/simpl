# Maintainer-only fallback MariaDB for fresh-install-test.mjs; not shipped to installed projects.
services:
  db:
    image: mariadb:${MARIADB_VERSION:-12.3}
    environment:
      MARIADB_ROOT_PASSWORD: ""
      MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "yes"
    ports:
      - "127.0.0.1:${SIMPL_TEST_DB_PORT:-3307}:3306"
    healthcheck:
      test: [ "CMD", "healthcheck.sh", "--connect", "--innodb_initialized" ]
      interval: 5s
      timeout: 5s
      retries: 10
