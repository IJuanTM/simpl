  @addon-insert:replace('# @addon-placeholder:environment')
      DB_SERVER: db
    @addon-end

    @addon-insert:replace('# @addon-placeholder:depends_on')
    depends_on:
      db:
        condition: service_healthy
    @addon-end
    
    @addon-insert:replace('# @addon-placeholder:volumes')
  simpl_db_data:
    @addon-end
    
    @addon-insert:replace('# @addon-placeholder:services')
  db:
    image: mariadb:${MARIADB_VERSION:-12.3}
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_PASSWORD:-}
      MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "yes"
    ports:
      - "${DB_PORT:-3307}:3306"
    volumes:
      - simpl_db_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "healthcheck.sh", "--connect", "--innodb_initialized" ]
      interval: 5s
      timeout: 5s
      retries: 10
    @addon-end
